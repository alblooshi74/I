<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ملخص ميدتيرم   </title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6faf0;--card:#fff;--tx:#23262b;--sub:#6b7280;--bd:#dfe8d0;--a:#3f7d0f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181a;--card:#22272a;--tx:#f1ede4;--sub:#b9b5aa;--bd:#383c44;--a:#5eead4}}
:root[data-theme="dark"]{--bg:#15181a;--card:#22272a;--tx:#f1ede4;--sub:#b9b5aa;--bd:#383c44;--a:#5eead4}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7;font-size:15px}
.s{padding:18px;max-width:640px;margin:auto}
h2{font-size:26px;margin:28px 4px 14px;color:var(--a)}
.c{background:var(--card);border:2px solid var(--bd);border-radius:24px;padding:20px 22px;margin:12px 0}
.g{border-right:8px solid var(--a)}
.btn{display:flex;align-items:center;gap:18px;background:var(--card);border:2px solid var(--bd);border-radius:26px;padding:22px 20px;margin:16px 0;color:var(--tx);text-decoration:none}
.ic{flex:none;width:68px;height:68px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:34px}
.btn b{display:block;font-size:22px;line-height:1.4}
.btn small{display:block;font-size:15px;color:var(--sub);margin-top:4px}
</style>
</head>
<body>
<section class="s"><h2>المواضيع</h2>
<div class="c g">اختر الموضوع وسيفتح لك الملخص .</div>
<div id="L"></div></section>
<script>
/* غيّر الروابط هنا فقط */
var V=[
{t:"ما هو علم الإجتماع؟ ",d:"",i:"1",c:"#000000",u:"1.html"},
{t:"طرق البحث الإجتماعي",d:" ",i:"2",c:"#000000",u:"2.html"},
{t:"دوركايم  ",d:"",i:"3",c:"#000000",u:"3.html"},
{t:"فيبر وماركس  ",d:"",i:"4",c:"#000000",u:"4.html"},
{t:"النظرية المعاصرة  ",d:"",i:"5",c:"#000000",u:"5.html"},
{t:"أسئلة وتمارين  ",d:"إفهم،واختبر فهمك",i:"ᝰ.ᐟ",c:"#000000",u:"6.html"}]

document.getElementById("L").innerHTML=V.map(function(v){return '<a class="btn" href="'+v.u+'" target="_blank" rel="noopener"><span class="ic" style="background:'+v.c+'">'+v.i+'</span><span><b>'+v.t+'</b><small>'+v.d+'</small></span></a>'}).join("");
</script></body></html>
