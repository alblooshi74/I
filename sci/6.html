<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>أسئلة  </title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f7f4ec;--card:#fff;--tx:#25262b;--a:#0f766e;--b:#b45309;--c:#6d28d9;--l:#e4dcc8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181c;--card:#22252b;--tx:#efece4;--l:#3a3d46;--a:#5eead4}}
:root[data-theme="dark"]{--bg:#16181c;--card:#22252b;--tx:#efece4;--l:#3a3d46;--a:#5eead4}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.75;font-size:15px}
.s{display:none;padding:14px;max-width:640px;margin:auto}.s.on{display:block}
h2{font-size:20px;margin:4px 0 8px;color:var(--a)}h3{font-size:16px;margin:10px 0 4px;color:var(--b)}
.c{background:var(--card);border:2px solid var(--l);border-radius:14px;padding:10px 12px;margin:8px 0}
.g{border-right:6px solid var(--a)}.o{border-right:6px solid var(--b)}.p{border-right:6px solid var(--c)}
.row{display:flex;gap:8px}.row>div{flex:1}
table{width:100%;border-collapse:collapse;font-size:13.5px}td,th{border:1px solid var(--l);padding:5px}th{background:var(--l)}
td:first-child{font-weight:bold;color:var(--b)}
.q{background:var(--card);border:2px solid var(--c);border-radius:12px;padding:10px;margin:7px 0;cursor:pointer}
.q .w{font-size:20px;font-weight:bold;color:var(--c);text-align:center}
.q .m{display:none;margin-top:6px;border-top:1px dashed var(--l);padding-top:6px}
.q.t .m{display:block}
.m b{color:var(--a)}
nav{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--bg);border-top:1px solid var(--l);max-width:640px;margin:auto}
button{font:inherit;background:var(--a);color:#fff;border:0;border-radius:10px;padding:7px 16px}
</style><style>
.tabs{display:flex;gap:8px;padding:10px 14px;max-width:640px;margin:auto;position:sticky;top:0;background:var(--bg);z-index:5}
.tabs button{flex:1;background:var(--card);color:var(--tx);border:2px solid var(--l)}
.tabs button.on{background:var(--a);color:#fff;border-color:var(--a)}
.q .w{font-size:16px}.q .m{font-size:14px}.hint{font-size:12.5px;opacity:.7;text-align:center}
.opt{display:block;width:100%;text-align:right;background:var(--card);color:var(--tx);border:2px solid var(--l);margin:7px 0;padding:10px 12px;border-radius:12px}
.opt.ok{background:#15803d;color:#fff;border-color:#15803d}.opt.no{background:#b91c1c;color:#fff;border-color:#b91c1c}
.row2{display:flex;gap:8px;margin-top:8px}.row2 button{flex:1}
.idk{background:var(--b)}.ex{margin-top:8px}.bar{height:6px;background:var(--l);border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--a)}
.big{text-align:center;font-size:34px;font-weight:bold;color:var(--a)}
</style>
</head><body>
<div class="tabs"><button id="t1" class="on" onclick="tab(1)">إفهم</button><button id="t2" onclick="tab(2)">اختبر فهمك</button></div>
<section class="s on" id="p1"><div class="hint">اضغط على البطاقة لتظهر المعلومة</div><div id="cards"></div></section>
<section class="s" id="p2"><div id="quiz"></div></section>
<script>
var D=[{"t": "علم الاجتماع وأهدافه", "q": "ما الأهداف الثلاثة الأساسية لعلم الاجتماع؟", "o": ["الوصف والتفسير والاستشراف", "الوصف والتجريب والتنبؤ", "التفسير والنقد والتغيير", "الرصد والقياس والحكم"], "a": 0, "ex": "<b>علم الاجتماع:</b> محاولة منهجية وعلمية لفهم التطور الاجتماعي، لا يكتفي بوصف السلوك بل يكشف الأنماط الكامنة التي تصوغه.<br><b>الأهداف:</b> الوصف (ماذا يحدث؟) · التفسير (لماذا؟) · الاستشراف (إلى أي اتجاه يسير؟)"}, {"t": "المخيال السوسيولوجي", "q": "ما الذي يربطه المخيال السوسيولوجي عند ميلز؟", "o": ["الماضي بالمستقبل", "المشكلات الشخصية بالقضايا العامة والبنى الاجتماعية", "الفرد بالدولة فقط", "النظرية بالمنهج"], "a": 1, "ex": "<b>المخيال:</b> يربط المشكلات الشخصية (السيرة الذاتية) بالقضايا العامة (البنى والقوى الاجتماعية والتاريخية).<br>البطالة ترتبط بانكماش اقتصادي وتحولات سوق العمل، والطلاق بتحولات الأعراف والمؤسسات، فلا تُقرأ كتقصير شخصي فقط."}, {"t": "فردية أم اجتماعية؟", "q": "أي مما يلي سمة المشكلة الاجتماعية؟", "o": ["تُحل بحل فردي أو أسري", "تقع في نطاق السيرة الذاتية", "تمس قطاعات واسعة وتحتاج فعلًا جمعيًا", "تمس الفرد ودائرته القريبة فقط"], "a": 2, "ex": "<b>الفردية:</b> تمس الفرد ودائرته، وحلولها فردية أو أسرية.<br><b>الاجتماعية:</b> تمس قطاعات واسعة، موضوع نقاش عام، ولا يُتصدى لها إلا بفعل جمعي.<br><b>أسبابها الأربعة:</b> الانحراف عن القيم والمعايير · تراجع فاعلية المؤسسات · التنوع الاجتماعي والثقافي · ممارسة القوة وتوزيع السلطة."}, {"t": "الزلازل والفيضانات", "q": "لماذا لا تُصنَّف الزلازل مشكلة اجتماعية؟", "o": ["لأنها غير مدمرة", "لأنها لا تمس السكان", "لأنها نادرة الحدوث", "لأن أصولها طبيعية وليست اجتماعية ولا تُتقى بالفعل الجمعي"], "a": 3, "ex": "شرط التصنيف: أن تكون ذات <b>أصول اجتماعية</b> وأن يمكن اتقاؤها أو علاجها بالفعل الجمعي وتعديل السياسات. الكوارث الطبيعية أصولها طبيعية."}, {"t": "الكمي والنوعي والمختلط", "q": "أي أداة تنتمي إلى المنهج الكمي؟", "o": ["الاستبيانات المغلقة", "المقابلات المتعمقة", "الإثنوغرافيا", "تحليل المحتوى الكيفي"], "a": 0, "ex": "<b>النوعي:</b> فهم المعاني والتجارب (مقابلات متعمقة، إثنوغرافيا، تحليل محتوى).<br><b>الكمي:</b> قياس الظواهر واختبار الفرضيات بالبيانات الرقمية (استبيانات، Big Data، علم الاجتماع الحاسوبي).<br><b>المختلط:</b> جمع الاثنين لفهم أعمق وأشمل."}, {"t": "الإثنوغرافيا وحدودها", "q": "ما أبرز حدود الإثنوغرافيا؟", "o": ["لا تدرس الحياة اليومية", "تحتاج إلى بيانات رقمية فقط", "صعوبة التعميم وتأثر التفسير بخلفية الباحث", "لا تتضمن ملاحظة مباشرة"], "a": 2, "ex": "<b>الإثنوغرافيا:</b> منهج ميداني يفهم الحياة الاجتماعية من الداخل بالملاحظة المباشرة والمعايشة والتفاعل.<br><b>حدودها:</b> صعوبة التعميم (نتائج مرتبطة بجماعة محددة) + ذاتية الباحث وخلفيته."}, {"t": "الموافقة المستنيرة والسرية", "q": "ماذا يفعل الباحث لحماية السرية في البحث النوعي؟", "o": ["ينشر الأسماء الحقيقية بعد الموافقة", "يستخدم أسماء مستعارة أو أرقام حالات", "يعتمد على حماية قانونية مهنية مضمونة", "يحتفظ بالأسماء في مكان عام"], "a": 1, "ex": "<b>الموافقة المستنيرة:</b> يفهم المشارك الأهداف والإجراءات والمخاطر والفوائد، وتُوثَّق كتابيًا بتاريخ وتوقيع (وممثل قانوني لذوي الإعاقة الذهنية).<br><b>السرية:</b> أسماء مستعارة أو أرقام، وهي بالغة الأهمية في النوعي لأن إخفاء الهوية شبه مستحيل. الباحثون لا يتمتعون بحماية قانونية مهنية وقد تُلزمهم المحكمة بالإفصاح."}, {"t": "الوقائع الاجتماعية والتضامن", "q": "أي خاصية ليست من خصائص الوقائع الاجتماعية عند دوركايم؟", "o": ["خارجية عن الفرد", "عامة بين الأفراد", "مُلزِمة", "فردية تعتمد على كل شخص"], "a": 3, "ex": "<b>خصائصها:</b> خارجية · عامة · قسرية/مُلزِمة.<br><b>الآلي:</b> مجتمع تقليدي، تشابه ووعي جمعي قوي، تقسيم عمل محدود، قانون قمعي.<br><b>العضوي:</b> مجتمع حديث، تخصص واعتماد متبادل، قانون تعويضي تقويمي."}, {"t": "المقدَّس والدنيوي", "q": "كيف يحافظ المجتمع على الحدود بين المقدَّس والدنيوي؟", "o": ["بالطقوس والمحظورات والقواعد", "بإلغاء الفروق بينهما", "بترك الأفراد يحددونها", "بالإقناع الفردي فقط"], "a": 0, "ex": "<b>المقدَّس:</b> أشياء ورموز يفصلها المجتمع ويوقّرها (نصوص دينية، أعلام، نُصُب).<br><b>الدنيوي:</b> العادي اليومي بلا مكانة خاصة.<br><b>الحفاظ:</b> بالطقوس والمحظورات والقواعد، وخرق الحدود يستدعي ردود فعل أو عقوبات اجتماعية ورسمية."}, {"t": "البيروقراطية والقفص الحديدي", "q": "ما «القفص الحديدي» عند فيبر؟", "o": ["أسلوب إدارة مرن", "نظام عقاب قانوني", "نوع من السلطة الكاريزمية", "أن يصبح الفرد حبيس نظام إداري عقلاني صارم يسلبه حريته وإبداعه"], "a": 3, "ex": "<b>عناصر البيروقراطية:</b> تقسيم العمل · التسلسل الهرمي · القواعد والإجراءات المكتوبة · التوظيف بالكفاءة والمؤهلات.<br><b>القفص الحديدي:</b> تحذير من الإفراط في العقلنة الذي يسلب الفرد حريته ومرونته وإبداعه."}, {"t": "أنواع السلطة عند فيبر", "q": "السلطة التي تقوم على إيمان الأتباع بصفات قائد استثنائية هي:", "o": ["التقليدية", "الكاريزمية", "القانونية العقلانية", "الإقطاعية"], "a": 1, "ex": "<b>التقليدية:</b> شرعيتها من العادات والتقاليد الموروثة.<br><b>القانونية-العقلانية:</b> من القوانين الرسمية والمنصب.<br><b>الكاريزمية:</b> من إيمان الأتباع بصفات القائد الاستثنائية، وهي هشة قد تزول إذا تراجع الاعتراف."}, {"t": "ماركس والصراع الطبقي", "q": "ما مصدر قوة البرجوازية عند ماركس؟", "o": ["امتلاك وسائل الإنتاج والسيطرة على وسائل التبادل", "العدد الكبير من الأفراد", "العادات والتقاليد", "الكاريزما"], "a": 0, "ex": "<b>الصراع الطبقي:</b> المحرك الأساسي للتاريخ. في الرأسمالية بين <b>البرجوازية</b> (مالكة وسائل الإنتاج) و<b>البروليتاريا</b> (تبيع قوة عملها بأجر).<br><b>مصادر القوة:</b> 1) وسائل الإنتاج (مصانع، آلات، تكنولوجيا، رأس مال) 2) وسائل التبادل (أسواق، شبكات مالية وتجارية) 3) التوسع المستمر للأسواق وتطوير الإنتاج لزيادة الأرباح."}, {"t": "الوظيفية وأنساق بارسونز", "q": "أي مما يلي ليس من أنساق بارسونز الثلاثة؟", "o": ["النسق الثقافي", "نسق الشخصية", "النسق الاقتصادي", "النسق الاجتماعي"], "a": 2, "ex": "<b>الوظيفية:</b> تشبّه المجتمع بكائن حي من مؤسسات مترابطة، لكل منها وظيفة تحفظ الاستقرار والتوازن.<br><b>أنساق بارسونز:</b> الثقافي (القيم والمعايير) · الشخصية (الدوافع والحاجات) · الاجتماعي (العلاقات والأدوار بين «الأنا» و«الآخر»)."}, {"t": "النظرية النقدية", "q": "ما المفهوم الذي طوّرته النظرية النقدية لتفسير صعوبة الثورة العمالية؟", "o": ["الحتمية الاقتصادية", "الوعي الزائف", "القفص الحديدي", "الوعي الجمعي"], "a": 1, "ex": "<b>النشأة:</b> ثلاثينيات القرن العشرين، معهد البحوث الاجتماعية بفرانكفورت، متأثرة بالماركسية.<br><b>نقد الحداثة:</b> شككت في أن العلم والتقنية والتعليم يقودان حتمًا للتحرر بعد النازية والفاشية والحروب.<br><b>نقد الماركسية:</b> رفضت الحتمية الاقتصادية، وطوّرت «الوعي الزائف» الذي يغيّب وعي العمال بمصالحهم الطبقية."}],i=0,sc=0,miss=[],list=[],done=false,pool=null;
function esc(x){return x}
document.getElementById("cards").innerHTML=D.map(function(d,k){return '<div class="q" onclick="this.classList.toggle(\'t\')"><div class="w">'+(k+1)+'. '+d.t+'</div><div class="m">'+d.ex+'</div></div>'}).join("");
function tab(n){for(var k=1;k<=2;k++){document.getElementById("p"+k).classList.toggle("on",k==n);document.getElementById("t"+k).classList.toggle("on",k==n)}scrollTo(0,0)}
function start(arr){list=arr;i=0;sc=0;miss=[];show()}
function show(){
 var q=document.getElementById("quiz");
 if(i>=list.length){var pct=Math.round(sc/list.length*100);q.innerHTML='<h2>النتيجة</h2><div class="c g"><div class="big">'+sc+' / '+list.length+'</div><div class="hint">'+pct+'%</div></div><div class="row2"><button onclick="start(D.map(function(_,k){return k}))">إعادة الاختبار</button>'+(miss.length?'<button class="idk" onclick="start(miss.slice())">إعادة الأخطاء ('+miss.length+')</button>':'')+'</div>';return}
 var d=D[list[i]];
 q.innerHTML='<div class="bar"><i style="width:'+(i/list.length*100)+'%"></i></div><div class="hint">سؤال '+(i+1)+' من '+list.length+'</div><h3>'+d.t+'</h3><div class="c o"><b>'+d.q+'</b></div><div id="opts">'+d.o.map(function(o,k){return '<button class="opt" onclick="pick('+k+')">'+o+'</button>'}).join("")+'</div><div id="fb"></div><div class="row2" id="act"><button class="idk" onclick="idk()">ما عرفتها</button></div>';
 done=false}
function lock(){done=true;var b=document.querySelectorAll(".opt");for(var k=0;k<b.length;k++)b[k].disabled=true}
function reveal(){var d=D[list[i]];var b=document.querySelectorAll(".opt");b[d.a].classList.add("ok");document.getElementById("fb").innerHTML='<div class="c g ex"><b>الشرح:</b><br>'+d.ex+'</div>'}
function nextBtn(){document.getElementById("act").innerHTML='<button onclick="i++;show()">'+(i==list.length-1?'النتيجة':'التالي')+'</button>'}
function pick(k){if(done)return;var d=D[list[i]];lock();var b=document.querySelectorAll(".opt");
 if(k==d.a){sc++;b[k].classList.add("ok");document.getElementById("fb").innerHTML='<div class="c g ex"><b>إجابة صحيحة!</b></div>';nextBtn()}
 else{b[k].classList.add("no");miss.push(list[i]);document.getElementById("act").innerHTML='<button class="idk" onclick="reveal();nextBtn()">ما عرفتها</button>'}}
function idk(){if(done)return;lock();miss.push(list[i]);reveal();nextBtn()}
start(D.map(function(_,k){return k}));
</script></body></html>
